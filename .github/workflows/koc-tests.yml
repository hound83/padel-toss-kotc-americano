name: KOC checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    # Pin to a Playwright-supported image (ubuntu-latest currently resolves to 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scheduling and name-list unit tests
        run: node --test tests/koc.test.cjs tests/bulk-names.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: All browser integration tests
        run: node --test tests/*.browser.test.cjs
        env:
          PADEL_SCREENSHOT_DIR: test-results
      - name: Browser design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padel-design-previews
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
