name: Live Toss 3.1 release check
on:
  push:
    branches:
      - qa/toss-3-1-production-check
permissions:
  contents: read
jobs:
  public-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install chromium
      - name: Score and close one synthetic session on the public Worker
        run: node tests/cloudflare-live.smoke.cjs
